<header class="fixed top-0 left-0 right-0 bg-white border-b-2 sm:border-b-4 border-black z-50">
  <nav class="container mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16 sm:h-20">
      <!-- Logo - Brutalist style with color -->
      <a
        href="/"
        class="group font-black text-xl sm:text-2xl uppercase tracking-tight"
        aria-label="Silvio Baratto - Home"
      >
        <span class="bg-transparent group-hover:bg-[#F4D738] px-1 transition-all duration-150">Silvio</span><span class="text-[#9723C9]">Baratto</span>
      </a>

      <!-- Desktop Navigation -->
      <div class="hidden lg:flex items-center gap-1 xl:gap-2">
        <a
          routerLink="/about"
          class="px-3 xl:px-4 py-2 font-gooddog text-sm uppercase tracking-wider hover:bg-[#9723C9] hover:text-white transition-colors duration-150"
        >
          About
        </a>
        <a
          routerLink="/side-projects"
          class="px-3 xl:px-4 py-2 font-gooddog text-sm uppercase tracking-wider hover:bg-[#FF6B6B] hover:text-white transition-colors duration-150"
        >
          Projects
        </a>
        <a
          routerLink="/chatbot"
          class="px-3 xl:px-4 py-2 font-gooddog text-sm uppercase tracking-wider hover:bg-[#7FBC8C] transition-colors duration-150 whitespace-nowrap"
        >
          AI Chat
        </a>
        <a
          routerLink="/curriculum"
          class="px-3 xl:px-4 py-2 font-gooddog text-sm uppercase tracking-wider hover:bg-[#F4D738] transition-colors duration-150"
        >
          CV
        </a>

        <!-- Divider -->
        <div class="w-px h-6 bg-[#9723C9]/30 mx-2"></div>

        <!-- Social Icons -->
        <a
          href="https://github.com/SilvioBaratto"
          target="_blank"
          rel="noopener noreferrer"
          class="p-2 hover:bg-[#9723C9] hover:text-white transition-colors duration-150"

        <a
          routerLink="/contact"
          class="ml-2 px-4 xl:px-5 py-2 font-gooddog text-sm uppercase tracking-wider bg-[#9723C9] text-white border-2 border-black hover:bg-[#F4D738] hover:text-black transition-colors duration-150"
        >
          Contact
        </a>
      </div>

      <!-- Mobile Menu Button - Purple hover -->
      <button
        (click)="toggleMobileMenu()"
        class="lg:hidden flex items-center justify-center w-12 h-12 border-2 border-black hover:bg-[#9723C9] hover:text-white transition-colors duration-150"
        [attr.aria-label]="mobileMenuOpen() ? 'Close navigation menu' : 'Open navigation menu'"
        [attr.aria-expanded]="mobileMenuOpen()"
        type="button"
      >
        <svg
          class="w-6 h-6 pointer-events-none"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          @if (mobileMenuOpen()) {
            <path
              stroke-linecap="square"
              stroke-linejoin="miter"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          } @else {
            <path
              stroke-linecap="square"
              stroke-linejoin="miter"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          }
        </svg>
      </button>
    </div>

    <!-- Mobile Menu -->
    @if (mobileMenuOpen()) {
      <div class="lg:hidden border-t-2 sm:border-t-4 border-black">
        <div class="flex flex-col">
          <a
            routerLink="/about"
            (click)="closeMobileMenu()"
            class="min-h-12 px-4 py-4 font-gooddog text-base uppercase tracking-wider border-b-2 border-black/20 hover:bg-[#9723C9] hover:text-white transition-colors duration-150"

            About
          </a>

            routerLink="/side-projects"
            (click)="closeMobileMenu()"
            class="min-h-12 px-4 py-4 font-gooddog text-base uppercase tracking-wider border-b-2 border-black/20 hover:bg-[#FF6B6B] hover:text-white transition-colors duration-150"
          >
            Side Projects
          </a>

            routerLink="/chatbot"
            (click)="closeMobileMenu()"
            class="min-h-12 px-4 py-4 font-gooddog text-base uppercase tracking-wider border-b-2 border-black/20 hover:bg-[#7FBC8C] transition-colors duration-150"
          >
            Chat with AI
          </a>

          <a
            routerLink="/curriculum"
            (click)="closeMobileMenu()"
            class="min-h-12 px-4 py-4 font-gooddog text-base uppercase tracking-wider border-b-2 border-black/20 hover:bg-[#F4D738] transition-colors duration-150"
          >
            Curriculum
          </a>

          <!-- Social Links Row -->
          <div class="flex border-b-2 border-black/20">
            <a
              href="https://github.com/SilvioBaratto"
              target="_blank"
              rel="noopener noreferrer"
              (click)="closeMobileMenu()"
              class="flex-1 min-h-12 px-4 py-4 font-gooddog text-base uppercase tracking-wider hover:bg-[#9723C9] hover:text-white transition-colors duration-150 flex items-center gap-3 border-r-2 border-black/20"

              <span>GitHub</span>

            routerLink="/contact"
            (click)="closeMobileMenu()"
            class="min-h-12 px-4 py-4 mt-4 mb-4 font-gooddog text-base uppercase tracking-wider bg-[#9723C9] text-white text-center hover:bg-[#F4D738] hover:text-black border-2 sm:border-4 border-black transition-colors duration-150"

  </nav>
</header>
